name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  # ------------------------------------------------------------------
  # 1. Build + tests TDD (JUnit) + BDD (Cucumber) + intégration WebFlux
  #    → aucun service externe requis (MongoDB et Ollama sont simulés)
  # ------------------------------------------------------------------
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilation + tests TDD/BDD
        run: mvn -B -ntp verify

      - name: Rapports de tests (JUnit + Cucumber)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/cucumber-report.html

  # ------------------------------------------------------------------
  # 2. Évaluation IA anti-hallucination contre un VRAI Llama 3.2 (Ollama)
  #    Lancée sur main et à la demande (coûteuse : ~2 Go de modèles).
  # ------------------------------------------------------------------
  ai-evaluation:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Un LLM n'est jamais 100 % déterministe : on publie le résultat sans bloquer la livraison.
    # Passez à "false" pour en faire une barrière de qualité stricte.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Installer et démarrer Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > /tmp/ollama.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://localhost:11434/api/tags && break; sleep 2; done

      - name: Télécharger les modèles
        run: |
          ollama pull llama3.2
          ollama pull nomic-embed-text

      - name: Tests d'évaluation IA
        run: mvn -B -ntp test -Pai-eval

  # ------------------------------------------------------------------
  # 3. Image Docker multi-stage (publiée sur GHCR uniquement depuis main)
  # ------------------------------------------------------------------
  docker:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Connexion à GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (et push sur main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
