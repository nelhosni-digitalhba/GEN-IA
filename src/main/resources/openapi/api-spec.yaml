openapi: 3.0.3
info:
  title: Customer & Product AI Blueprint API
  version: 1.0.0
  description: |
    **Contrat API-First** : ce fichier est écrit AVANT le code. Les contrôleurs WebFlux
    (package `interfaces.rest`) l'implémentent, et le test `ApiContractTest` vérifie
    automatiquement que chaque opération déclarée ici existe bien dans le code.

    - CRUD réactif : `/api/v1/customers`, `/api/v1/products`
    - Recherche sémantique (RAG) : `/api/v1/products/search`
    - Assistant IA (Llama 3.2 via Ollama) : `/api/v1/assistant/chat` et `/api/v1/assistant/stream`
    - Manual UTCP : `/.well-known/utcp.json`
servers:
  - url: http://localhost:8080
tags:
  - name: Customers
  - name: Products
  - name: Assistant
  - name: UTCP

paths:
  /api/v1/customers:
    get:
      tags: [Customers]
      operationId: listCustomers
      summary: Liste les clients
      responses:
        '200':
          description: Liste des clients
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Customer' }
    post:
      tags: [Customers]
      operationId: createCustomer
      summary: Crée un client
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerRequest' }
      responses:
        '201':
          description: Client créé
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/customers/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Customers]
      operationId: getCustomer
      summary: Récupère un client
      responses:
        '200':
          description: Client trouvé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Customers]
      operationId: updateCustomer
      summary: Met à jour un client
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerRequest' }
      responses:
        '200':
          description: Client mis à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Customers]
      operationId: deleteCustomer
      summary: Supprime un client
      responses:
        '204': { description: Client supprimé }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/products:
    get:
      tags: [Products]
      operationId: listProducts
      summary: Liste les produits
      responses:
        '200':
          description: Liste des produits
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Product' }
    post:
      tags: [Products]
      operationId: createProduct
      summary: Crée un produit (et l'indexe pour la recherche sémantique)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductRequest' }
      responses:
        '201':
          description: Produit créé
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/products/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Products]
      operationId: getProduct
      summary: Récupère un produit
      responses:
        '200':
          description: Produit trouvé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Products]
      operationId: updateProduct
      summary: Met à jour le libellé et la description (le SKU est immuable)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductRequest' }
      responses:
        '200':
          description: Produit mis à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Products]
      operationId: deleteProduct
      summary: Supprime un produit
      responses:
        '204': { description: Produit supprimé }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/products/search:
    get:
      tags: [Products]
      operationId: searchProducts
      summary: Recherche sémantique (embeddings nomic-embed-text) sur la description des produits
      parameters:
        - name: q
          in: query
          required: true
          description: Besoin exprimé en langage naturel
          schema: { type: string, example: "courir sous la pluie" }
        - name: topK
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 10, default: 3 }
      responses:
        '200':
          description: Produits les plus proches, du plus pertinent au moins pertinent
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProductMatch' }
        '503': { $ref: '#/components/responses/AiUnavailable' }

  /api/v1/assistant/chat:
    post:
      tags: [Assistant]
      operationId: chat
      summary: Pose une question à l'assistant IA (réponse complète)
      description: |
        L'assistant combine RAG (contexte produits) et function calling (outils CRUD).
        Si Ollama est indisponible, Resilience4j renvoie un message de repli (HTTP 200).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssistantRequest' }
      responses:
        '200':
          description: Réponse de l'assistant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistantAnswer' }

  /api/v1/assistant/stream:
    post:
      tags: [Assistant]
      operationId: stream
      summary: Pose une question à l'assistant IA (réponse streamée en Server-Sent Events)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssistantRequest' }
      responses:
        '200':
          description: Flux de fragments de texte (un événement SSE par fragment)
          content:
            text/event-stream:
              schema: { type: string }

  /.well-known/utcp.json:
    get:
      tags: [UTCP]
      operationId: manual
      summary: Manual UTCP décrivant comment appeler directement les endpoints REST
      responses:
        '200':
          description: Manual UTCP 1.0
          content:
            application/json:
              schema: { type: object }

components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }

  responses:
    BadRequest:
      description: Donnée invalide (règle du domaine)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Ressource introuvable
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Règle métier violée (email ou SKU déjà utilisé, SKU non modifiable)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    AiUnavailable:
      description: Service IA indisponible (circuit breaker ouvert)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    CustomerRequest:
      type: object
      required: [nom, prenom, tel, email, adresse]
      properties:
        nom: { type: string, maxLength: 100, example: Curie }
        prenom: { type: string, maxLength: 100, example: Marie }
        tel: { type: string, example: "0601020304", description: "10 à 15 chiffres, '+' autorisé" }
        email: { type: string, format: email, example: marie@science.fr }
        adresse: { type: string, maxLength: 300, example: 1 rue de Paris }
    Customer:
      allOf:
        - type: object
          required: [id]
          properties:
            id: { type: string, example: 665f1c2e8b3e4a1d2c3b4a59 }
        - $ref: '#/components/schemas/CustomerRequest'
    ProductRequest:
      type: object
      required: [sku, label, description]
      properties:
        sku:
          type: string
          pattern: '^[A-Z0-9]{2,10}(-[A-Z0-9]{1,10}){0,3}$'
          example: SKU-123
          description: Identité métier, normalisée en majuscules, non modifiable
        label: { type: string, maxLength: 150, example: Lampe de bureau LED }
        description:
          type: string
          minLength: 10
          maxLength: 2000
          example: Lampe LED à intensité réglable, idéale pour le télétravail le soir.
    Product:
      allOf:
        - type: object
          required: [id]
          properties:
            id: { type: string }
        - $ref: '#/components/schemas/ProductRequest'
    ProductMatch:
      type: object
      properties:
        id: { type: string }
        sku: { type: string }
        label: { type: string }
        description: { type: string }
        score: { type: number, format: double, description: Similarité cosinus (0..1) }
    AssistantRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          maxLength: 2000
          example: Quel produit me conseilles-tu pour le télétravail ?
    AssistantAnswer:
      type: object
      properties:
        answer: { type: string }
        blocked: { type: boolean, description: true si le garde-fou a refusé la requête }
        candidateSkus:
          type: array
          description: SKU injectés dans le contexte RAG (traçabilité anti-hallucination)
          items: { type: string }
    Problem:
      type: object
      description: RFC 9457 Problem Details
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
